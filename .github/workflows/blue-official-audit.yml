name: ENEM blue official audit (non-publishing)

# Acquisition of the complete historical corpus is an independent network task.
# Integration checks use restored, hash-bound approvals; see validation-progress.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blue-official-audit
  cancel-in-progress: true

jobs:
  official-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction dependencies
        run: |
          python -m pip install 'pymupdf>=1.25,<2'
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y poppler-utils
          fi
      - name: Inspect Inep TLS certificate chain without bypassing checks
        run: |
          mkdir -p /tmp/inep-tls
          python - <<'PY'
          import hashlib, os, socket, ssl
          from pathlib import Path
          print("Python OpenSSL:", ssl.OPENSSL_VERSION)
          print("Default trust paths:", ssl.get_default_verify_paths())
          for key in ("HTTPS_PROXY", "https_proxy", "HTTP_PROXY", "http_proxy", "NO_PROXY",
                      "SSL_CERT_FILE", "SSL_CERT_DIR", "CURL_CA_BUNDLE", "REQUESTS_CA_BUNDLE"):
              print(key, "set" if os.environ.get(key) else "unset")
          ca = Path("/etc/ssl/certs/ca-certificates.crt")
          print("System CA SHA256:", hashlib.sha256(ca.read_bytes()).hexdigest())
          print("Trusted certificates:", len(ssl.create_default_context().get_ca_certs()))
          print("DNS:", sorted({(a[0].name, a[4][0]) for a in socket.getaddrinfo("download.inep.gov.br", 443)}))
          PY
          curl --version
          openssl version -a
          for family in 4 6; do
            set +e
            timeout 15 openssl s_client -"$family" -connect download.inep.gov.br:443 \
              -servername download.inep.gov.br -showcerts -tls1_2 \
              -verify_hostname download.inep.gov.br \
              -CAfile /etc/ssl/certs/ca-certificates.crt </dev/null > /tmp/inep-tls/openssl-ipv"$family".txt 2>&1
            result=$?
            set -e
            echo "OpenSSL IPv$family exit=$result"
            cat /tmp/inep-tls/openssl-ipv"$family".txt
            for mode in environment direct; do
              flags=()
              if [ "$mode" = direct ]; then flags=(--noproxy '*'); fi
              set +e
              curl -"$family" "${flags[@]}" --proto '=https' --connect-timeout 5 --max-time 15 \
                --cacert /etc/ssl/certs/ca-certificates.crt --silent --show-error \
                --output /dev/null --write-out 'http=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n%{certs}\n' \
                https://download.inep.gov.br/educacao_basica/enem/provas/2017/2017_PV_impresso_D1_CD1.pdf \
                > /tmp/inep-tls/curl-ipv"$family"-"$mode".txt 2>&1
              result=$?
              set -e
              echo "curl IPv$family $mode exit=$result"
              cat /tmp/inep-tls/curl-ipv"$family"-"$mode".txt
            done
          done
      - name: Download regular blue INEP PDFs (2017-2025)
        run: |
          python scripts/download_inep_enem.py \
            --dest data/enem-pdfs/oficiais \
            --manifest data/enem-pdfs/blue-download-manifest.json \
            --years 2017 2018 2019 2020 2021 2022 2023 2024 2025 \
            --delay 1 \
            --ca-bundle /etc/ssl/certs/ca-certificates.crt
      - name: Build staging and independently audit official PDF text
        run: python scripts/rebuild_blue.py --all
      - name: Check completeness and publish job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pdfs = list(Path('data/enem-pdfs/oficiais').glob('*-regular-d*-azul.pdf'))
          report = Path('data/blue-staging/official-validation-summary.json')
          lines = ['### Official-PDF audit (non-publishing)',
                   f'- Official blue exam PDFs acquired: {len(pdfs)}/18',
                   '- No database mutations or publication allowed.']
          if report.is_file():
              data = json.loads(report.read_text())
              lines.append(f"- Staged records examined: {data['total']}")
              for status, count in sorted(data['summary'].items()):
                  lines.append(f'- {status}: {count}')
              answers = Path('data/blue-staging/official-answer-summary.json')
              if answers.is_file():
                  answer_data = json.loads(answers.read_text())
                  lines.append(f"- Answer evidence: {answer_data['summary']}")
          else:
              lines.append('- Validation not completed; inspect download report and logs.')
          matrix = Path('data/blue-staging/audit-matrix-summary.json')
          if matrix.is_file():
              m = json.loads(matrix.read_text())
              lines.append(f"- Audit matrix: {m['positions_reported']}/1620 positions; 0 certified")
              for priority, count in sorted(m.get('priority_counts', {}).items()):
                  lines.append(f'- {priority}: {count}')
          if len(pdfs) != 18:
              print('::warning::Some official exam PDFs are missing. Audit is incomplete.')
          summary = '\n'.join(lines) + '\n'
          print(summary)
          Path(os.environ['GITHUB_STEP_SUMMARY']).open('a').write(summary)
          if len(pdfs) != 18 or not report.is_file():
              raise SystemExit('FAIL CLOSED: incomplete official PDF sources')
          if data['total'] != 1620 or data['summary'].get('SOURCE_MISSING', 0):
              raise SystemExit('FAIL CLOSED: source coverage incomplete')
          PY
      - name: Upload evidence reports (never publish questions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enem-blue-official-audit
          path: |
            /tmp/inep-tls/*.txt
            data/enem-pdfs/oficiais/download-report.json
            data/enem-pdfs/blue-download-manifest.json
            data/blue-staging/report.json
            data/blue-staging/official-validation-summary.json
            data/blue-staging/official-validation.jsonl
            data/blue-staging/official-answer-summary.json
            data/blue-staging/official-answer-evidence.jsonl
            data/blue-staging/audit-matrix.jsonl
            data/blue-staging/audit-matrix-summary.json
            data/blue-staging/audit-priority.csv
            data/blue-staging/exceptions.csv
          if-no-files-found: warn
          retention-days: 7
